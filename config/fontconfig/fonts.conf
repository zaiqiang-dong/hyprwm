<?xml version="1.0" encoding="UTF-8"?>
<fontconfig>

  <!-- ================================================================
       微信启动字族枚举替换(target="scan",2026-11-25 /tmp/fcw-wechat5.log):
       微信启动时用 FcConfigGetFonts/FcFontList 遍历整个系统字体集合,
       按族名 "Noto Sans CJK SC" 选默认/输入框字体(不走 pattern
       substitution,pattern 规则拦不住),再用其内嵌 FreeType 直接打开
       该文件渲染(主进程动态 FT 调用为零,故此前所有规则对它无效)。
       处理:scan 时把真 NotoSansCJK 的 SC face 族名改掉(藏名;字体
       仍在集合中,charset 兜底不受影响),同时给 JetBrainsMonoNL
       Nerd Font Mono(16 个字重文件)挂上 "Noto Sans CJK SC" 族名
       ——微信枚举到的就是 JetBrains;中文缺字形由微信编辑器的逐字
       回退接住(trace 实测打字阶段 [] charset 查询 → STCuKai-SC),
       得到 英文 JetBrains + 中文楷体。pattern 层面请求 "Noto Sans
       CJK SC" 仍由下面的微信归一化规则接管(→ trio),互不影响。
       规则顺序:先藏名后挂名,避免挂上的名字被藏名规则误伤。
       改本块后需 fc-cache -f 重建缓存。 -->
  <match target="scan">
    <test name="family"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign_replace"><string>NotoSansCJK-SC-orig</string></edit>
  </match>
  <match target="scan">
    <test name="family"><string>JetBrainsMonoNL Nerd Font Mono</string></test>
    <edit name="family" mode="append"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- ================================================================
       JetBrains Mono webfonts 剔除:jetbrains-mono 包在
       /usr/share/fonts/JetBrainsMono/fonts/webfonts/ 下带 16 个
       woff2(@font-face 专用,族名 "JetBrains Mono",14 种字重),
       被 fontconfig 收录后以其超广 charset 在 FcFontSort(Chrome
       PDFium/skia 路径)打分中击败一切 weak/泛型回退请求——
       连 strong Arial+Liberation 归一化列表都排不过它,是 aa.pdf
       在 Chrome 里正文错乱成 JetBrains 的根因之一。woff2 本就只
       应供网页 @font-face 自行加载,系统索引纯属副作用,reject。 -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/JetBrainsMono/fonts/webfonts/*</glob>
    </rejectfont>
  </selectfont>

  <!-- ================================================================
       PDF 非嵌入字体直通(不做字体转发):
       Chrome PDFium/ poppler 等查看器对 PDF 非嵌入字体的请求
       (FC_DEBUG 实测 2026-10-22:Chrome 请求裸 "Arial"(带/不带
       weight/slant)、"Helvetica"(weight 80/100)等)此前会命中
       下方 sans-serif 主分支,被改成 JetBrains 等宽字体,导致
       PDF 正文错乱。本区块把这类请求归一化为
       [请求原名, 度量兼容替补],保持请求字体的度量兼容渲染:
         Arial(-Bold/-Italic/-BoldItalic 及 *MT PostScript 名)
           → 原名 + Liberation Sans/Arimo(Arial 度量克隆)
         Helvetica(-Bold/-Oblique/-BoldOblique)
           → 原名 + (系统自然解析为 Nimbus Sans)
       请求原名保留在第 0 位(安装真 Arial 后直接命中,无需改配置)。
       按名字补写 weight/slant:PDF 查看器只传名字不带样式参数。
       网页以 Arial/Helvetica 打头的字族栈同样命中,按度量兼容
       字体渲染(用户已确认接受)。
       ================================================================ -->
  <!-- 裸族名(Chrome PDFium 实际请求形态) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
  </match>
  <!-- PostScript 名(poppler 系查看器请求形态) -->
  <match target="pattern">
    <test name="family"><string>ArialMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-ItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-Bold</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-Italic</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldItalic</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-Bold</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-Oblique</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-BoldOblique</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>

  <!-- ================================================================
       带空格形态(划词翻译 PDF.js 阅读器实测请求,2026-10-26 FC_DEBUG):
       PDF.js(pdf-viewer/build/pdf.worker.mjs 的 HI())把非嵌入字体的
       PostScript 名按 [- ,+] 拆词、过滤样式词后以空格重连,作为 canvas
       ctx.font 的 css 字族名请求:
         "Arial-BoldMT"     → "Arial BoldMT"(BoldMT 不是样式词,保留)
         "Arial-ItalicMT"   → "Arial ItalicMT"
         "Arial-BoldItalicMT" → "Arial BoldItalicMT"
       (不带 weight/slant 参数);local() 别名链另有
       "Helvetica Bold"/"Helvetica Oblique"/"Helvetica Bold Oblique"。
       这些带空格形态不命中上面的连字符规则,此前落入下方 sans-serif
       主分支被改成 JetBrains 等宽,导致 PDF 粗体/斜体正文错乱成等宽
       (常规 ArialMT 是单 token,命中上面的 ArialMT 规则,所以只有
       粗斜体乱)。Chrome 原生 PDFium 请求 "Arial"+weight 参数,不受
       影响。归一化方式与上方连字符规则一致。 -->
  <match target="pattern">
    <test name="family"><string>Arial BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial ItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial BoldItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Bold</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Oblique</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Bold Oblique</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>

  <!-- ================================================================
       Times New Roman PS 名(2026-11-17 tmp.pdf 实测,FC_DEBUG 抓的
       真实请求形态):tmp.pdf(Aspose 导出)的非嵌入字体
       TimesNewRomanPSMT / TimesNewRomanPS-BoldMT / TimesNewRomanPS-ItalicMT
       大部分被 PDF.js 4.10.38 的 stdFontMap 映射成 "Times New Roman"
       + weight/slant 参数(正常路径,系统 30-metric-aliases 处理),
       但 viewer.mjs 的字体样式路由仍会以
         "TimesNewRomanPS BoldMT"(空格形态,FC_DEBUG 实抓,
          weight=200 bold,slant=0)
       请求 —— 不命中任何已有规则 → 落入下方 sans-serif 主分支被
       改成 JetBrains 等宽。连同各查看器(poppler 连字符、PDF.js
       空格)两种形态一并归一化到 Times New Roman(Tinos/Liberation
       Serif 为度量兼容替补),按名字补写 weight/slant。 -->
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPSMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New RomanPSMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS-BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New RomanPS BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New RomanPS-BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS ItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS-ItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New RomanPS-ItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS BoldItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>TimesNewRomanPS-BoldItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New RomanPS-BoldItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Times New Roman</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Tinos</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>

