<?xml version="1.0" encoding="UTF-8"?>
<fontconfig>
  <!-- macOS/Windows 专有字族 → sans-serif(网页 fallback 归一化) -->
  <match target="pattern">
    <test name="family">
      <string>-apple-system</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Helvetica Neue</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Tahoma</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>PingFang SC</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>PingFangSC-Light</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>PingFangSC-Regular</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>PingFangSC-Medium</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>PingFangSC-Semibold</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Microsoft YaHei</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Microsoft Yahei</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Microsoft Yahei UI</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Microsoft Jhenghei</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Microsoft Jhenghei UI</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Hiragino Sans GB</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Hiragino Sans</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>ヒラギノ角ゴシック</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Yu Gothic</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Yu Gothic UI</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>sans-serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>ui-monospace</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SFMono-Regular</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>SF Mono</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Menlo</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Consolas</string>
    </test>
    <edit binding="same" mode="assign" name="family">
      <string>monospace</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrains Mono NL</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STCuKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STZhongKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文楷体</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文粗楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文中楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <test compare="less" name="weight">
      <const>demibold</const>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- 粗体请求(≥600):拉丁 JetBrains Mono(自身 Bold 文件),
       中文华文粗楷。不覆盖 weight。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrains Mono NL</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STCuKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STZhongKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文楷体</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文粗楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文中楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <test compare="more_eq" name="weight">
      <const>demibold</const>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- 兜底:pattern 未携带 weight 时(如部分脚本/CLI 查询),
       上面两个分支的 weight 测试都会落空。上面已用 assign_replace
       清空了整个 family 列表,命中过的 pattern 不会再有 sans-serif,
       不会重复触发。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrains Mono NL</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STCuKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STZhongKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文楷体</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文粗楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文中楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- monospace:与 sans-serif 同理,JetBrains 必须在第 0 位。
       不覆盖 weight(终端等程序对字重敏感),也不 assign,
       保留原有栈中其它字族,仅把 JetBrains 提到最前。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>JetBrains Mono NL</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>emoji</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STCuKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>STZhongKai-SC</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文楷体</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文粗楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>华文中楷</string>
    </test>
    <test compare="not_eq" name="family" qual="all">
      <string>Noto Color Emoji</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
