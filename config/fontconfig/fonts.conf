<?xml version="1.0" encoding="UTF-8"?>
<fontconfig>

  <!-- ================================================================
       JetBrains Mono webfonts 剔除:jetbrains-mono 包在
       /usr/share/fonts/JetBrainsMono/fonts/webfonts/ 下带 16 个
       woff2(@font-face 专用,族名 "JetBrains Mono",14 种字重),
       被 fontconfig 收录后以其超广 charset 在 FcFontSort(Chrome
       PDFium/skia 路径)打分中击败一切 weak/泛型回退请求——
       连 strong Arial+Liberation 归一化列表都排不过它,是 aa.pdf
       在 Chrome 里正文错乱成 JetBrains 的根因之一。woff2 本就只
       应供网页 @font-face 自行加载,系统索引纯属副作用,reject。 -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/JetBrainsMono/fonts/webfonts/*</glob>
    </rejectfont>
  </selectfont>

  <!-- ================================================================
       PDF 非嵌入字体直通(不做字体转发):
       Chrome PDFium/ poppler 等查看器对 PDF 非嵌入字体的请求
       (FC_DEBUG 实测 2026-10-22:Chrome 请求裸 "Arial"(带/不带
       weight/slant)、"Helvetica"(weight 80/100)等)此前会命中
       下方 sans-serif 主分支,被改成 JetBrains 等宽字体,导致
       PDF 正文错乱。本区块把这类请求归一化为
       [请求原名, 度量兼容替补],保持请求字体的度量兼容渲染:
         Arial(-Bold/-Italic/-BoldItalic 及 *MT PostScript 名)
           → 原名 + Liberation Sans/Arimo(Arial 度量克隆)
         Helvetica(-Bold/-Oblique/-BoldOblique)
           → 原名 + (系统自然解析为 Nimbus Sans)
       请求原名保留在第 0 位(安装真 Arial 后直接命中,无需改配置)。
       按名字补写 weight/slant:PDF 查看器只传名字不带样式参数。
       网页以 Arial/Helvetica 打头的字族栈同样命中,按度量兼容
       字体渲染(用户已确认接受)。
       ================================================================ -->
  <!-- 裸族名(Chrome PDFium 实际请求形态) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
  </match>
  <!-- PostScript 名(poppler 系查看器请求形态) -->
  <match target="pattern">
    <test name="family"><string>ArialMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-ItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldItalicMT</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-Bold</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-Italic</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial-BoldItalic</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Arial</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Arimo</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-Bold</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-Oblique</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica-BoldOblique</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Helvetica</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Nimbus Sans</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="strong"><const>bold</const></edit>
    <edit name="slant" mode="assign" binding="strong"><const>italic</const></edit>
  </match>

  <!-- macOS/Windows 专有字族 → sans-serif(网页 fallback 归一化) -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Light</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Medium</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Semibold</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Yahei</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Yahei UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Jhenghei</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Jhenghei UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Sans GB</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ヒラギノ角ゴシック</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SFMono-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test name="weight" compare="less">
      <const>demibold</const>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- 粗体请求(≥600):拉丁 JetBrains Mono(自身 Bold 文件),
       中文华文粗楷。不覆盖 weight。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test name="weight" compare="more_eq">
      <const>demibold</const>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- 兜底:pattern 未携带 weight 时(如部分脚本/CLI 查询),
       上面两个分支的 weight 测试都会落空。上面已用 assign_replace
       清空了整个 family 列表,命中过的 pattern 不会再有 sans-serif,
       不会重复触发。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- monospace:与 sans-serif 同理,JetBrains 必须在第 0 位。
       不覆盖 weight(终端等程序对字重敏感),也不 assign,
       保留原有栈中其它字族,仅把 JetBrains 提到最前。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
