  </match>
  <match target="pattern">
    <test name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- ================================================================
       微信默认字族归一化(2026-11-24/25 LD_PRELOAD trace,
       /tmp/fcw-wechat.log, /tmp/fcw-wechat3.log):
       微信启动即以 [Noto Sans CJK SC, noto color emoji](小写弱绑定
       emoji 是其实测请求形态)请求 fontconfig,用它渲染默认样式的界面
       文字(含聊天输入框)。此前三条路径都得不到本配置的字族:
       1) FcConfigSubstitute 后微信自己按族名列表逐字选——
          "Noto Sans CJK SC" 本机已安装(NotoSansCJK-*.ttc)直接命中,
          且小写 "noto color emoji" 与下方主分支 not_eq "Noto Color
          Emoji" guard 大小写不敏感等价,主分支整个被跳过;
       2) FcFontMatch 路径:pattern 带非 zh 的 lang(实测 lang=ja +
          charset → Noto Sans CJK JP;lang=zh 才解析到 STCuKai);
       3) 微信把缓存字体的 (file,index) 钉进 pattern 按尺寸重查
          (实测 file=NotoSansCJK-Regular.ttc + index=2 → 强制返回
          ttc 的 2 号 face "Noto Sans CJK JP",family 改写完全失效;
          file=DejaVuSans.ttf 同理)。剥离钉死的 file/index 后,
          family/lang 规则恢复生效。
       归一化:族名就地替换为 [JetBrainsMonoNL Nerd Font Mono,
       STCuKai-SC, Noto Color Emoji],lang 归一化为 zh-cn(否则
       STCuKai 的 lang=zh 在打分上输给带 ja 的 NotoCJK)。本规则在主
       分支之前;替换后列表已含 JetBrains,主分支 guard 自动跳过,不会
       二次改写。 -->
  <match target="pattern">
    <test name="family" qual="any"><string>Noto Sans CJK SC</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>JetBrainsMonoNL Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="weak"><string>STCuKai-SC</string></edit>
    <edit name="family" mode="append" binding="weak"><string>Noto Color Emoji</string></edit>
    <edit name="lang" mode="assign_replace" binding="same"><string>zh-cn</string></edit>
  </match>
  <!-- 微信 file-pin 剥离(仅命中带这两个钉死值的 pattern,正常查询零影响):
       剥掉 file/index 后, [Noto Sans CJK SC]/[Noto Sans SC]/
       [DejaVu Sans] 的请求落到上面/下方主分支的字族规则上。 -->
  <match target="pattern">
    <test name="file" qual="any"><string>/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc</string></test>
    <edit name="file" mode="delete_all"/>
    <edit name="index" mode="delete_all"/>
  </match>
  <match target="pattern">
    <test name="file" qual="any"><string>/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf</string></test>
    <edit name="file" mode="delete_all"/>
    <edit name="index" mode="delete_all"/>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test name="weight" compare="less">
      <const>demibold</const>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- 粗体请求(≥600):拉丁 JetBrains Mono(自身 Bold 文件),
       中文华文粗楷。不覆盖 weight。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test name="weight" compare="more_eq">
      <const>demibold</const>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- 兜底:pattern 未携带 weight 时(如部分脚本/CLI 查询),
       上面两个分支的 weight 测试都会落空。上面已用 assign_replace
       清空了整个 family 列表,命中过的 pattern 不会再有 sans-serif,
       不会重复触发。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrains Mono NL</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STCuKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>STZhongKai-SC</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文楷体</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文粗楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>华文中楷</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- monospace:与 sans-serif 同理,JetBrains 必须在第 0 位。
