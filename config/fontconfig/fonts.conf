<?xml version="1.0" encoding="UTF-8"?>
<fontconfig>

  <!-- ================================================================
       飞书等 Electron/Chromium 应用不读 GTK 主题字体,CSS 里硬编码了
       macOS/Windows 字体族。其中 Microsoft YaHei 在本机已安装
       (wryh.ttf),会直接命中并绕过下面的 sans-serif 规则,
       因此必须把这些字体族显式重定向到 sans-serif。
       ================================================================ -->
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Light</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Medium</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFangSC-Semibold</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Yahei</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Yahei UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Jhenghei</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft Jhenghei UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Sans GB</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Hiragino Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ヒラギノ角ゴシック</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Yu Gothic UI</string></test>
    <edit name="family" mode="assign" binding="same"><string>sans-serif</string></edit>
  </match>

  <!-- GitHub 等站点代码块的字族栈:ui-monospace, SFMono-Regular,
       "SF Mono", Menlo, Consolas, "Liberation Mono", monospace。
       前五个本机未安装,若不重定向,会一路落到已安装的
       Liberation Mono;重定向到 monospace 后由下面的 monospace
       规则统一交给 JetBrains Mono。 -->
  <match target="pattern">
    <test name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SFMono-Regular</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>SF Mono</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Consolas</string></test>
    <edit name="family" mode="assign" binding="same"><string>monospace</string></edit>
  </match>

  <!-- 显式请求非 Mono Nerd 字体(书签栏 gtk-font-name、waybar 等):
       上面的 not_eq 守卫使泛型规则对此类 pattern 全部跳过,但系统
       49-sansserif.conf 追加的 sans-serif 仍在 family 列表里,中文
       会按系统默认回落到 Noto Sans CJK 而不是 STCuKai(书签栏中文
       不是楷体的根因)。这里用 assign_replace 重建列表:JetBrains
       居第 0 位(Chrome 系统字体路径只看第一个 family),后面依次
       weak append STCuKai(中文)与 Noto Color Emoji(emoji)。
       注意 weak prepend 会插到 strong 之前、把 STKai 顶到第 0 位,
       会复现 GitHub 全站楷体问题,所以只能用 assign+append。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- 新版华文 STKaiti 全家桶(2026-10 重新安装):
       STKaitiRegular.ttf → STKaiTi-Regular-SC  华文楷体   (墨迹密度 0.056)
       STKaitiBold.ttf    → STZhongKai-SC       华文中楷   (0.075,明显偏粗)
       STKaitiBlack.ttf   → STCuKai-SC          华文粗楷   (0.097,最重)
       三个文件的元数据均自称 usWeightClass=400,fontconfig 无法按字重
       自动区分。当前选择:所有中文统一用 STCuKai-SC(粗楷),
       不按字重分流;粗体时由 Chrome 合成加粗。 -->

  <!-- 所有中文统一用华文粗楷 STCuKai-SC;拉丁优先 JetBrains Mono。
       注意两点:
       1. JetBrains 必须位于替换后 family 列表的第 0 位。Chrome/Skia
          的部分代码路径(系统字体读取、按字符 fallback 的 FcFontSort)
          只看列表第一个 family,不区分 strong/weak binding;若把
          STKai 以 prepend 放到第 0 位,Chrome 会连拉丁文本也全部用
          楷体渲染(GitHub 全 STCuKai 的根因)。
       2. family 必须用 assign_replace(替换整个列表)而非 assign
          (只替换第一个值)。飞书等应用的 CSS 栈是一长串被重定向的
          字族(-apple-system, PingFang SC, ..., sans-serif →
          [sans-serif × 9]),用 assign 时某个分支命中后列表里仍残留
          sans-serif,后面的兜底分支会再次触发,把 STKai 重复插入,
          破坏分支间按字重的分流。
       3. 系统 49-sansserif.conf 会给一切不含泛型名的 pattern 追加
          sans-serif,因此显式请求字体的 pattern(如 waybar 的
          Nerd 字体)也会命中本规则并被改写。下面的 not_eq 守卫
          豁免显式请求的非 Mono Nerd 字体:命中它们时规则不触发,
          保留原字体(否则 Mono 变体会把图标压进单格变小)。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test name="weight" compare="less">
      <const>demibold</const>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- 粗体请求(≥600):拉丁 JetBrains Mono(自身 Bold 文件),
       中文华文粗楷。不覆盖 weight。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <test name="weight" compare="more_eq">
      <const>demibold</const>
    </test>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
  <!-- 兜底:pattern 未携带 weight 时(如部分脚本/CLI 查询),
       上面两个分支的 weight 测试都会落空。上面已用 assign_replace
       清空了整个 family 列表,命中过的 pattern 不会再有 sans-serif,
       不会重复触发。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <edit binding="same" mode="prepend" name="weight">
      <const>medium</const>
    </edit>
    <edit binding="strong" mode="assign_replace" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- monospace:与 sans-serif 同理,JetBrains 必须在第 0 位。
       不覆盖 weight(终端等程序对字重敏感),也不 assign,
       保留原有栈中其它字族,仅把 JetBrains 提到最前。 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMonoNL Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>JetBrainsMono Nerd Font</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>emoji</string>
    </test>
    <edit binding="strong" mode="prepend" name="family">
      <string>JetBrainsMonoNL Nerd Font Mono</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>STCuKai-SC</string>
    </edit>
    <edit binding="weak" mode="append" name="family">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
