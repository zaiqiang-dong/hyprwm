# hyprland-share-picker (hyprtoolkit) theme — Catppuccin-Green-Dark
background        = 0xFF1c1c1c   # theme_bg_color
base              = 0xFF1f2824   # theme_base_color
alternate_base    = 0xFF263029   # base 的亮一档（交替行）
text              = 0xFF949494   # theme_fg_color
bright_text       = 0xFFeff1f5   # theme_selected_fg_color 的实体色
link_text         = 0xFF89b4fa   # Catppuccin blue
accent            = 0xFF00af5f   # theme_selected_bg_color（你的绿色）
accent_secondary  = 0xFF89b4fa
rounding_large    = 12           # gtk.css 里主流 border-radius: 12px
rounding_small    = 6            # gtk.css 小圆角 6px
font_family       = JetBrainsMonoNL Nerd Font Mono Bold
font_family_monospace = JetBrainsMonoNL Nerd Font Mono Bold
icon_theme        = Papirus-Dark
h1_size           = 21
h2_size           = 17
h3_size           = 14
font_size         = 13
small_font_size   = 12
